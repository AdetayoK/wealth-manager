name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Python tests
        working-directory: backend
        env:
          WEALTH_SESSION_SECRET: "ci-only-session-secret-0123456789012345"
          WEALTH_USER: owner
          WEALTH_PASSWORD_HASH: "unused-by-fixtures"
        run: python -m pytest -q
      - name: Verify JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/modules.js
          node --check frontend/data.js
          node --check frontend/login.js
      - name: Python compilation
        run: python -m compileall -q backend/app
