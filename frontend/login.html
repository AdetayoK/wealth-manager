<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Wealth Manager</title><link rel="stylesheet" href="/style.css"></head>
<body class="login-body">
<main class="login-card">
<div class="brand-logo">W<span>M</span></div>
<p class="eyebrow">PRIVATE WEALTH INTELLIGENCE</p>
<h1>Your financial command center.</h1>
<p class="subtext">Secure access to your wealth plan, portfolio and decision tools.</p>
<form id="login" class="form-stack">
<label>Username<input id="username" name="username" autocomplete="username" required autofocus></label>
<label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
<button type="submit" class="primary">Sign in <span aria-hidden="true">→</span></button>
<p id="message" role="alert" class="error-text"></p>
</form>
<p class="footnote">Local-first • No registration • No automated trades</p>
</main>
<script src="/login.js"></script>
</body></html>
